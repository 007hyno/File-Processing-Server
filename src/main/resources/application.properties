spring.application.name=file-processing-server
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=${PORT:8080}

# Store DB on disk inside a ./data folder relative to project root
spring.datasource.url=jdbc:h2:file:./data/jobdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClass-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep schema updated without dropping data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Keep H2 web console active for visual inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true